<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>모의 네이버 모바일 홈</title></head>
<body>
<form><input id="query" name="query" class="sch_input" autocomplete="off"></form>
<ul class="atcmp_list" style="display:none"></ul>
<script>
const data = {"역삼 헬스장": ["역삼 헬스장 추천", "역삼 헬스장 가격", "역삼 헬스장 PT", "역삼 피티"],
              "강남역 PT": ["강남역 PT 추천", "강남역 PT 가격", "강남역 PT 샵", "강남역 피티"]};
document.getElementById('query').addEventListener('input', e => {
  const ul = document.querySelector('.atcmp_list'); ul.innerHTML = '';
  const items = data[e.target.value] || [];
  ul.style.display = items.length ? 'block' : 'none';
  for (const t of items) { const li = document.createElement('li'); li.innerHTML = `<a href="#"><span class="kwd">${t}</span></a>`; ul.appendChild(li); }
});
</script></body></html>
