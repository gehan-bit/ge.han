# 글 폴더(workspace/<글>/photos.yaml)에 두는 사진 지정·보정 파일. 없으면 자동.
# 순서대로 사진 자리에 들어간다. 드라이브 파일명 또는 raw 폴더의 파일명.
order:
  - "DSC05423.jpg"
  - "DSC00215 복사본.jpg"
  - "DSC05642.jpg"

# 자동 크롭 결과가 마음에 안 들 때 사진별로 손본다. 값은 모두 0~1 비율.
overrides:
  "DSC05642.jpg":
    protect: [[0.2, 0.0, 0.4, 0.2]]   # [x, y, w, h] 잘리면 안 되는 영역(로고 등). 여러 개 가능
    anchor: "center"                   # third | center
  "리츄엣1.jpg":
    top: 0.10                          # 자를 위치(위쪽 y)를 직접 지정
  "어떤사진.jpg":
    focus_y: 0.35                      # 얼굴 대신 이 지점을 기준점으로
  "가로로보여야하는사진.jpg":
    skip_crop: true                    # 세로여도 자르지 않음
